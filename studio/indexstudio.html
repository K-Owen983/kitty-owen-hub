<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitty Owen Studio</title>

<link rel="stylesheet" href="studio.css">

</head>

<body>

<div class="editor">

<h1>Kitty Owen Studio</h1>

<input id="title" type="text" placeholder="Título del artículo">

<select id="category">
<option>Comprender para decidir</option>
<option>Comunicación</option>
<option>Liderazgo</option>
<option>Ciencia de Datos</option>
<option>Tecnología</option>
</select>

<textarea
id="excerpt"
rows="4"
placeholder="Resumen">
</textarea>

<textarea
id="content"
rows="18"
placeholder="Escribe aquí tu artículo...">
</textarea>

<button id="publish">

Publicar

</button>

</div>

<script src="studio.js"></script>

</body>
</html>
